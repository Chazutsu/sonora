version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    groups:
      typescript-toolchain:
        patterns:
          - typescript
          - typescript-eslint
          - "@typescript-eslint/*"
          - eslint
          - "@eslint/*"
        update-types:
          - minor
          - patch
      development-dependencies:
        dependency-type: development
        exclude-patterns:
          - typescript
          - typescript-eslint
          - "@typescript-eslint/*"
          - eslint
          - "@eslint/*"
        update-types:
          - minor
          - patch
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: typescript
        versions:
          - ">=7.0.0"
    open-pull-requests-limit: 10
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    groups:
      github-actions:
        patterns: ["*"]
