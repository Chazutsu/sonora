name: Bug report
description: Report a reproducible problem in Sonora.
title: "[Bug]: "
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Sonora. Search existing issues before submitting.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open…\n2. Run…\n3. Observe…"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Sonora version
      placeholder: 0.1.1
    validations:
      required: true
  - type: input
    id: obsidian
    attributes:
      label: Obsidian version and platform
      placeholder: Obsidian 1.x, macOS / Windows / Linux / iOS / Android
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove private vault content and credentials before attaching anything.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and found no duplicate.
          required: true
        - label: I reproduced this with the latest Sonora release.
          required: true
